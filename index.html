" class="region">עזה</text><path id="aim" fill="none" stroke="#4b8eaa" stroke-width="8" stroke-linecap="round" opacity=".65" visibility="hidden"/><g id="travel"></g><g id="nodes"></g></svg><header><b>גבולות</b><small id="calendar" aria-label="תאריך במשחק"></small></header><div id="end-stats"></div><div id="status" role="status"></div><button id="reset" aria-label="התחלה מחדש">↻</button><article id="card"><h2 id="title"></h2><p id="body"></p><p id="trigger" hidden></p><div id="choices" hidden><small id="response-label" hidden>ראש הממשלה בתגובה:</small><button id="approve">אישור</button><button id="decline">סירוב</button></div><button id="okay">פסדר</button></article><section id="delta" hidden aria-live="polite"></section><aside id="unit-info" hidden></aside></main><script>// Fictional normalized units for a control prototype; not real deployment data.
class TransferModel {
 constructor(nodes){this.nodes=nodes.map(n=>({...n,troops:n.kind==='source'?[{home:n.id,count:n.initial}]:n.home?[{home:n.home,count:n.initial}]:[]}));this.flights=[];this.sequence=0;for(const n of this.nodes.filter(n=>n.home)){const home=this.get(n.home);home.troops[0].count-=n.initial}}
 get(id){return this.nodes.find(n=>n.id===id)}
 count(id){return this.get(id).troops.reduce((s,t)=>s+t.count,0)}
 incoming(id){return this.flights.filter(f=>f.to===id).reduce((s,f)=>s+f.count,0)}
 total(){return this.nodes.reduce((s,n)=>s+this.count(n.id),0)+this.flights.reduce((s,f)=>s+f.count,0)}
 send(from,to){
  const a=this.get(from),b=this.get(to);if(!a||!b||a===b)return null;
  const available=b.reserveOnly?a.troops.filter(t=>t.home==='reserve').reduce((s,t)=>s+t.count,0):this.count(from);if(available<2)return null;
  const capacity=b.kind==='target'?b.need:b.initial;
  const deficit=Math.max(0,capacity-this.count(to)-this.incoming(to));
  // In-flight reinforcements already cover the shortage; avoid duplicate dispatch.
  if(this.incoming(to)>0&&deficit===0)return null;
  const amount=Math.min(Math.floor(available/2),deficit||Math.floor(available/2));
  let remaining=amount;const troops=[];
  for(const t of a.troops){if(b.reserveOnly&&t.home!=='reserve')continue;const take=Math.min(remaining,t.count);if(take){t.count-=take;remaining-=take;troops.push({home:t.home,count:take})}if(!remaining)break;}
  a.troops=a.troops.filter(t=>t.count>0);
  const f={id:++this.sequence,from,to,troops,count:amount};this.flights.push(f);return f;
 }

 arrive(id){const f=this.flights.find(f=>f.id===id);if(!f)return false;const b=this.get(f.to);for(const troop of f.troops){const same=b.troops.find(t=>t.home===troop.home);if(same)same.count+=troop.count;else b.troops.push({...troop});}this.flights=this.flights.filter(v=>v!==f);return true}
}

// Abstract prototype balance, not a model of real-world security.
class DangerModel {
 constructor(){this.sites=new Map();this.failed=null;}
 step(nodes,count,seconds,paused=false){
  if(paused||this.failed)return this.failed;
  for(const n of nodes){
   if(n.reserve)continue;
   const required=n.kind==='target'?n.need:n.initial*.45/(n.readiness||1);
   const deficit=Math.max(0,1-count(n.id)/required);
   const state=this.sites.get(n.id)||{grace:8,pressure:0};
   if(deficit>0){const active=Math.max(0,seconds-state.grace);state.grace=Math.max(0,state.grace-seconds);state.pressure=Math.min(1,state.pressure+active*deficit/24);}
   else {state.pressure=Math.max(0,state.pressure-seconds/12);if(state.pressure===0)state.grace=8;}
   this.sites.set(n.id,state);
   if(state.pressure>=1){this.failed=n.id;return n.id;}
  }
  return null;
 }
}
if(typeof module!=='undefined')module.exports=DangerModel;

const RESOURCE_LABELS={money:'כסף',support:'תמיכה עולמית',unity:'אחדות העם'};
function extensiveSettlement(nodes){return nodes.some(n=>n.id==='gaza')||nodes.filter(n=>n.kind==='target'&&!['old1','old2','gaza','tour'].includes(n.id)).length>=3;}
function policyEffect(effect,nodes){const result={...effect};if(result.support>0&&extensiveSettlement(nodes))result.support=0;return result;}

  const eligible=model.nodes.filter(n=>n.kind==='target'&&!n.reserveOnly&&!['old1','old2'].includes(n.id));
  const removed=effect.withdraw==='gaza'?eligible.filter(n=>n.region==='gaza'||n.id==='gaza'):eligible.filter(n=>n.region!=='gaza'&&n.id!=='gaza').slice(-1);

}

function animateAttack(dt){if(!attack)return;const a=attack;a.elapsed+=dt;const t=a.elapsed/1000,z=Math.min(1,t/.9),ease=z*z*(3-2*z),w=420/(1+1.1*ease),h=740/(1+1.1*ease);const x=Math.max(0,Math.min(420-w,(a.target.x+a.from.x)/2-w/2)),y=Math.max(0,Math.min(740-h,(a.target.y+a.from.y)/2-h/2));svg.setAttribute('viewBox',x+' '+y+' '+w+' '+h);a.dots.forEach((dot,i)=>{const p=Math.max(0,Math.min(1,(t-.9-i*.06)/1.8));dot.setAttribute('opacity',t>.9?1:0);dot.setAttribute('cx',a.from.x+(a.target.x-a.from.x)*p+Math.sin(i*2)*3);dot.setAttribute('cy',a.from.y+(a.target.y-a.from.y)*p+Math.cos(i*2)*3);});if(t>3.25){const b=Math.min(1,(t-3.25)/.9);a.blast.setAttribute('r',4+35*b);a.blast.setAttribute('opacity',1-b*.85);a.dots.forEach(d=>d.setAttribute('opacity',0));}if(t>=4.5){if(a.incident){$('attack')?.remove();svg.setAttribute('viewBox','0 0 420 740');phase=5;currentCard=a.incident;showCard(currentCard.title,currentCard.body,true);}else{phase=6;currentCard=null;campaign.state.civiliansKilled+=a.target.kind==='target'?24:38;showEndStats();showCard('מתקפה קטלנית','חמושים חדרו דרך גזרה שחסרה בה אבטחה. סך האזרחים שנהרגו בפיגועים בכהונה: '+campaign.state.civiliansKilled+'.');}attack=null;}}

function showUnit(id){const n=model.get(id),box=$('unit-info'),main=svg.parentElement.getBoundingClientRect(),point=svg.createSVGPoint();point.x=n.x;point.y=n.y;const p=point.matrixTransform(svg.getScreenCTM());box.textContent=(n.reserve?'עתודת מילואים':n.kind==='target'?siteName(n.id):'כוח')+'\nכוח: '+(model.count(id)*1000).toLocaleString('he-IL')+' חיילים\nסדיר: '+((model.count(id)-reserveCount(n))*1000).toLocaleString('he-IL')+' · מילואים: '+(reserveCount(n)*1000).toLocaleString('he-IL')+'\nמצב מורל: מצוין\nמצב ציוד: '+((n.readiness||1)>=.95?'מצוין':n.readiness>=.85?'טוב':n.readiness>=.75?'שחוק':'דל')+(n.reserve?'\nהעתודה אינה יעד לתקיפה':'');box.style.left=Math.max(8,Math.min(main.width-218,p.x-main.x-100))+'px';box.style.top=Math.max(82,Math.min(main.height-180,p.y-main.y+32))+'px';box.hidden=false;}


function reserveCount(n){return n.troops.filter(t=>t.home==='reserve').reduce((s,t)=>s+t.count,0);}
function siteName(id){return ({old1:'גבעת בערך',old2:'מעלה אישור',farm:'חוות עוד רגע',caravans:'נווה זמני',gaza:'חוף הבטחה',second:'חוות ליד',extension:'רמת רק הרחבה',tour:'שביל הטעימות','new-1':'מעלה בינתיים','new-2':'גבעת עוד קצת','new-3':'נווה סופית'})[id]||'נקודת אבטחה';}
function checkResources(){if(phase!==6&&phase!==7&&campaign.state.civiliansKilled>=BALANCE.civilianLossLimit){phase=6;currentCard=null;showCard('הכהונה הסתיימה באסון','מספר האזרחים שנהרגו בפיגועים הגיע ל־'+campaign.state.civiliansKilled+'.');return;}const key=depletedResource(resources);if(!key||phase===6||phase===7)return;reveal=null;attack=null;phase=6;drag=null;currentCard=null;$('aim').setAttribute('visibility','hidden');showEndStats();showCard('הכהונה הסתיימה',({money:'הקופה התרוקנה. הממשלה אינה יכולה לממן את התחייבויותיה.',support:'התמיכה העולמית קרסה. ישראל נותרה מבודדת.',unity:'אחדות העם קרסה. הממשלה איבדה את היכולת להמשיך לתפקד.'})[key]);}
